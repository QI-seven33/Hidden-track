name: 问题反馈
description: 提供可复现的游戏、登录或运行问题
body:
  - type: markdown
    attributes:
      value: 不要提交二维码、Cookie、凭证、签名链接或私人数据库。安全漏洞请参阅 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本或提交号
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统、浏览器与运行方式
      placeholder: 例如 Windows / Edge / 本地 npm start
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 对局问题请补充轮次、出牌顺序和相关事件。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 脱敏截图、录屏或日志
      description: 游戏画面优先提供电脑网页版；上传前检查私人信息。
